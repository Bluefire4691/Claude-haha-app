name: Build haha.exe

on:
  push:
    branches: ["claude/windows-gif-prank-app-VGgol", "main"]
  workflow_dispatch:   # trigger manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create/delete releases and tags

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Generate haha.gif
        shell: bash
        run: python create_gif.py

      - name: Build exe with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --add-data "haha.gif;." \
            --hidden-import pyttsx3.drivers \
            --hidden-import pyttsx3.drivers.sapi5 \
            --version-file version_info.txt \
            --name haha \
            haha.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: haha-exe
          path: dist/haha.exe
          retention-days: 90

      - name: Delete old latest-build release (if exists)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes 2>/dev/null || true
          git push origin :refs/tags/latest-build 2>/dev/null || true

      - name: Create GitHub Release with exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-build dist/haha.exe \
            --title "haha.exe (latest build)" \
            --notes "Auto-built by GitHub Actions. Download haha.exe, drop it on your friend's Windows PC, and enjoy." \
            --prerelease
